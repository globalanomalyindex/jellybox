name: Bug report
description: A reproducible problem in the study or React foundation
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include relevant palette, light, panel and motion settings.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device and release or commit
    validations:
      required: true
